name: PR Checks
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run tests with coverage
        run: go test -race ./... -coverprofile=coverage.out
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep ^total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 70" | bc)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9

  scenario-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build linter
        run: go build -o olm-annotation-lint .
      - name: Test valid YAMLs pass
        run: |
          ./olm-annotation-lint --path testdata/valid
          echo "PASS: valid YAMLs accepted"
      - name: Test invalid YAMLs each fail (strict mode)
        run: |
          for f in testdata/invalid/*.yaml; do
            if ./olm-annotation-lint --path "$f" --strict > /dev/null 2>&1; then
              echo "FAIL: $f should have been rejected"
              exit 1
            fi
            echo "PASS: $f correctly rejected"
          done

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t olm-annotation-lint .

  action-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test action against valid files
        uses: ./
        with:
          path: testdata/valid
      - name: Test action catches invalid files
        id: invalid-test
        uses: ./
        with:
          path: testdata/invalid
        continue-on-error: true
      - name: Verify invalid files were caught
        if: steps.invalid-test.outcome == 'success'
        run: |
          echo "FAIL: action should have failed on invalid testdata"
          exit 1
