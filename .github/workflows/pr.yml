name: PR Checks
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run tests with coverage
        run: go test -race ./... -coverprofile=coverage.out
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep ^total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 70" | bc)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9

  scenario-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build linter
        run: go build -o olm-annotation-lint .
      - name: Run scenario tests
        run: bash hack/scenario-test.sh

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t olm-annotation-lint .

  # Tests the PR-built image against testdata. action-test uses the published
  # quay.io v1 image and cannot prove unreleased rules or flags.
  image-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image from PR
        run: docker build -t olm-annotation-lint:pr .
      - name: Valid testdata must pass
        run: docker run --rm -v "$PWD:/workspace:ro" olm-annotation-lint:pr --path /workspace/testdata/valid
      - name: Invalid testdata must fail
        run: |
          if docker run --rm -v "$PWD:/workspace:ro" olm-annotation-lint:pr --path /workspace/testdata/invalid; then
            echo "FAIL: image should have failed on testdata/invalid"
            exit 1
          fi
          echo "PASS: image rejected testdata/invalid"

  # Compatibility check against the last released Action image.
  # testdata/valid must remain acceptable to quay.io/bapalm/olm-annotation-lint:v1.
  # Do not add fixtures that only the PR binary would accept (for example
  # unknown annotations silenced by # olm-annotation-lint: ignore). Cover those
  # with scenario-test and image-test instead.
  action-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test action against valid files
        uses: ./
        with:
          path: testdata/valid
      - name: Test action catches invalid files
        id: invalid-test
        uses: ./
        with:
          path: testdata/invalid
        continue-on-error: true
      - name: Verify invalid files were caught
        if: steps.invalid-test.outcome == 'success'
        run: |
          echo "FAIL: action should have failed on invalid testdata"
          exit 1
