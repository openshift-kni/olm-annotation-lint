name: Release
on:
  push:
    tags:
      - "v*"

env:
  IMAGE: quay.io/bapalm/olm-annotation-lint

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Extract version tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Build binaries
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o olm-annotation-lint-linux-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o olm-annotation-lint-linux-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o olm-annotation-lint-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o olm-annotation-lint-darwin-arm64 .
      - name: Smoke test
        run: |
          ./olm-annotation-lint-linux-amd64 --version
          ./olm-annotation-lint-linux-amd64 --list-rules
          ./olm-annotation-lint-linux-amd64 --path testdata/valid
          ./olm-annotation-lint-linux-amd64 --path testdata/invalid/unknown_olm_annotation.yaml && exit 1 || true
      - name: Generate checksums
        run: sha256sum olm-annotation-lint-* > checksums.txt
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            olm-annotation-lint-*
            checksums.txt
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
