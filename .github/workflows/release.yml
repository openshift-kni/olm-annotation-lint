name: Release
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o olm-annotation-lint-linux-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o olm-annotation-lint-linux-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o olm-annotation-lint-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o olm-annotation-lint-darwin-arm64 .
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            olm-annotation-lint-*
