name: "OLM Annotation Lint"
description: "Validate OLM annotations on Kubernetes resources"
inputs:
  path:
    description: "Path or comma-separated paths to scan"
    required: false
    default: "."
  exclude:
    description: "Comma-separated paths to exclude"
    required: false
    default: ""
  strict:
    description: "Treat warnings as errors"
    required: false
    default: "false"
  allow:
    description: "Comma-separated annotation keys to allow (bypass unknown annotation errors)"
    required: false
    default: ""
  format:
    description: "Output format: text, json, github"
    required: false
    default: "github"
outputs:
  error-count:
    description: "Number of error-severity violations found"
  warning-count:
    description: "Number of warning-severity violations found"
  total-count:
    description: "Total number of violations found"
  has-errors:
    description: "Whether errors were found (true/false)"
runs:
  using: docker
  image: docker://quay.io/bapalm/olm-annotation-lint:v1
  args:
    - "--path"
    - ${{ inputs.path }}
    - "--exclude"
    - ${{ inputs.exclude }}
    - "--strict=${{ inputs.strict }}"
    - "--allow"
    - ${{ inputs.allow }}
    - "--format"
    - ${{ inputs.format }}
branding:
  icon: check-circle
  color: orange
